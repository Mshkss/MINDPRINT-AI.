services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindprint
      POSTGRES_USER: mindprint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindprint-local-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindprint"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://mindprint:${POSTGRES_PASSWORD:-mindprint-local-demo}@db:5432/mindprint
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://anatolii-botov.ru:3000}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
